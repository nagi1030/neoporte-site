<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAGI NAZO
    </title>

    <link rel="stylesheet" href="nazo.css">
</head>

<body>

<header>
    <h1>🧩  ネオポルテ謎</h1>
</header>


<nav>
    <a href="#">ホーム</a>
    <a href="#">問題一覧</a>
</nav>


<main>

<section class="search">
    <input type="text" placeholder="問題を検索">
    <button>検索</button>
</section>


<h2>📚 問題一覧</h2>


<div class="cards">


<div class="card">
    <h3>最初の謎</h3>

    <p class="level">
        
    </p>

    <p>
        一つ目の問題です
    </p>

    <button onclick="openPuzzle(1)">
        挑戦する
    </button>
</div>

</div>


<section id="puzzle" class="puzzle hidden">

<h2 id="title"></h2>

<img id="puzzleImage" src="数字の順に並べてできる言葉は.png" alt="ネオポルテナゾトキ">

<p id="question"></p>


<input id="answer" placeholder="答えを入力">

<button onclick="checkAnswer()">
回答する
</button>


<button onclick="showHint()">
💡ヒント
</button>


<p id="hint"></p>


<p id="result"></p>


<img id="puzzleAnsImage" src="数字の順に並べてできる言葉はAns.png" alt="解説画像" class="hidden">



</section>

</main>

<footer>

<p>
© NAGI NAZO
</p>

</footer>

<script src="nazo.js"></script>

</body>
</html>
