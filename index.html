<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ネオポルテ謎解き</title>

    <link rel="stylesheet" href="nazo.css">
</head>

<body>

    <!-- ヘッダー -->
    <header>
        <h1>ネオポルテ謎解き</h1>
    </header>


    <!-- ナビゲーション -->
    <nav>
        <a href="#home">ホーム</a>
        <a href="#nazo">謎解き</a>
    </nav>


    <!-- メイン -->
    <main id="home">

        <h2 id="nazo">謎解き一覧</h2>

        <div class="cards">

            <!-- 問題1 -->
            <div class="card">

                <h3>第1問</h3>

                <p class="level">
                    ☆☆☆☆★
                </p>

                <p>
                    数字の順に並べてできる言葉は？
                </p>

                <button onclick="openPuzzle(1)">
                    挑戦する
                </button>

            </div>


            <!-- 問題2 -->
            <div class="card">

                <h3>第2問</h3>

                <p class="level">
                    ☆☆☆★★
                </p>

                <p>
                    ？に入る言葉は？
                </p>

                <button onclick="openPuzzle(2)">
                    挑戦する
                </button>

            </div>

        </div>


        <!-- 謎解き表示部分 -->
        <section id="puzzle" class="puzzle hidden">

            <h2 id="title"></h2>


            <!-- 問題画像 -->
            <img
                id="puzzleImage"
                src=""
                alt="謎解き問題"
            >


            <!-- 問題文 -->
            <p id="question"></p>


            <!-- 回答入力 -->
            <input
                id="answer"
                type="text"
                placeholder="答えを入力"
            >


            <!-- 回答ボタン -->
            <button onclick="checkAnswer()">
                回答する
            </button>


            <!-- 答えを見る -->
            <button onclick="showAnswerConfirm()">
                👀 答えを見る
            </button>


            <!-- ヒント -->
            <button onclick="showHint()">
                💡 ヒント
            </button>


            <!-- ヒント表示 -->
            <p id="hint"></p>


            <!-- 正解・不正解 -->
            <p id="result"></p>


            <!-- 答えを見る確認画面 -->
            <div id="answerConfirm" class="hidden">

                <p>
                    本当に答えを見ますか？
                </p>

                <button onclick="showAnswer()">
                    はい
                </button>

                <button onclick="cancelAnswer()">
                    いいえ
                </button>

            </div>


            <!-- 答え -->
            <p
                id="answerDisplay"
                class="hidden"
            ></p>


            <!-- 解説画像 -->
            <img
                id="puzzleAnsImage"
                src=""
                alt="解説画像"
                class="hidden"
            >


            <!-- 解説文章 -->
            <p
                id="explanation"
                class="hidden"
            ></p>

        </section>

    </main>


    <!-- フッター -->
    <footer>

        <p>
            © NAGI NAZO
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="nazo.js"></script>

</body>

</html>
